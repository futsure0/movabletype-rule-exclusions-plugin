# OWASP CRS Plugin Descriptor
# See https://github.com/coreruleset/plugin-registry for the schema definition.

schema_version: 1

plugin:
  name: "movabletype-rule-exclusions-plugin"
  description: "CRS rule exclusions for the Movable Type administration screens"
  long_description: |
    Provides narrow rule exclusions so that users can save entries, pages
    and templates and upload assets in the Movable Type administration
    screens. Only the body fields are excluded, only from the XSS rules and
    rule 934100, and only for POST requests to the administration script
    that carry the Movable Type login cookie.
  type: "3rd-party"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "futsure0"
      url: "https://github.com/futsure0"
  repository: "https://github.com/futsure0/movabletype-rule-exclusions-plugin"
  keywords:
    - "movabletype"
    - "cms"
    - "rule-exclusions"

rule_id_range:
  # Not yet reserved in the plugin registry.
  start: 9533000
  end: 9533999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/movabletype-rule-exclusions-config.conf"
  variables:
    - name: "tx.movabletype-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enables or disables the plugin (0 to disable)."
      required: false
    - name: "tx.movabletype-rule-exclusions-plugin_admin_script"
      type: "string"
      default: "mt.cgi"
      description: "File name of the administration script (AdminScript in mt-config.cgi)."
      required: false
