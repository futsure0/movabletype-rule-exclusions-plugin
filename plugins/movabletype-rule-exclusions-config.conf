# OWASP CRS Plugin
# Plugin name: movabletype-rule-exclusions
# Plugin description: Rule exclusions for the Movable Type administration screens
# Rule ID block base: 9,533,000 - 9,533,999
# Plugin version: 0.1.0

# Generic rule to disable the plugin
#
# Plugins are enabled by default.
#
# They become active by placing them in the plugin folder. It is possible to
# control plugin activation via setting a variable. This can be done in the
# plugin config file here.
#
# The predefined variable name is meant to be "<plugin name>-plugin_enabled".
# For the movabletype-rule-exclusions-plugin, this means it can be disabled by
# setting tx.movabletype-rule-exclusions-plugin_enabled=0.
#
# Note that a global setting of this variable overrides the setting here.
# That means the "enabled" variable is only set by this rule if it has not
# been set before.
#
# Feel free to set the variable unconditionally here by replacing the
# SecRule line with an unconditional SecAction statement.
#
#SecRule &TX:movabletype-rule-exclusions-plugin_enabled "@eq 0" \
#    "id:9533010,\
#    phase:1,\
#    pass,\
#    nolog,\
#    ver:'movabletype-rule-exclusions-plugin/0.1.0',\
#    setvar:'tx.movabletype-rule-exclusions-plugin_enabled=0'"

# Name of the administration script (optional)
#
# Movable Type serves its administration screens from "mt.cgi" (the
# AdminScript setting in mt-config.cgi). The directory does not matter: any
# path that ends with "/<admin script>" is treated as the administration
# script. Change the name here if AdminScript has been changed:
#
#SecAction \
#    "id:9533020,\
#    phase:1,\
#    pass,\
#    nolog,\
#    ver:'movabletype-rule-exclusions-plugin/0.1.0',\
#    setvar:'tx.movabletype-rule-exclusions-plugin_admin_script=admin.cgi'"
#
# To use the plugin only on some hosts, disable it by default and enable it
# per host with tx.movabletype-rule-exclusions-plugin_enabled. See
# "Conditionally enable plugins for multi-application environments" in the
# CRS documentation.
