# OWASP CRS Plugin
# Plugin name: movabletype-rule-exclusions
# Plugin description: Rule exclusions for the Movable Type administration screens
# Rule ID block base: 9,533,000 - 9,533,999
# Plugin version: 0.1.0

# Documentation can be found here:
# https://github.com/futsure0/movabletype-rule-exclusions-plugin

# Generic rule to disable plugin
SecRule TX:movabletype-rule-exclusions-plugin_enabled "@eq 0" "id:9533099,phase:1,pass,nolog,ctl:ruleRemoveById=9533100-9533999"

# Default name of the administration script
SecRule &TX:movabletype-rule-exclusions-plugin_admin_script "@eq 0" \
    "id:9533090,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'movabletype-rule-exclusions-plugin/0.1.0',\
    setvar:'tx.movabletype-rule-exclusions-plugin_admin_script=mt.cgi'"


# -=[ Administration screens ]=-
#
# The exclusions below only apply to POST requests to the administration
# script that carry the Movable Type login cookie (mt_user). The cookie is
# not a security boundary (Movable Type itself checks the session and the
# magic token); it only narrows the exclusions to requests that look like a
# logged-in user saving content.

SecRule REQUEST_FILENAME "@endsWith /%{tx.movabletype-rule-exclusions-plugin_admin_script}" \
    "id:9533100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'movabletype-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        chain"
        SecRule &REQUEST_COOKIES:mt_user "@gt 0" \
            "t:none,\
            setvar:'tx.movabletype-rule-exclusions-plugin_admin_post=1'"

# [ Entries, pages and templates ]
#
# The body (text) and the extended body (text_more) of entries and pages,
# and the body of templates (text), are written as HTML. Authors routinely
# put script tags (for example maps or embeds), event handlers, HTML
# comments and Movable Type template tags (<$mt:Var ...$>) in them.
# Only these two fields are excluded, only from the XSS rules (tag
# attack-xss) and rule 934100, which matches template tags such as
# "<$mt:SetVar name="a" value="1"$>" as Node.js injection. The title, the
# keywords, the excerpt and all other fields stay checked.
SecRule TX:movabletype-rule-exclusions-plugin_admin_post "@eq 1" \
    "id:9533110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'movabletype-rule-exclusions-plugin/0.1.0',\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:text,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:text_more,\
    ctl:ruleRemoveTargetById=934100;ARGS:text,\
    ctl:ruleRemoveTargetById=934100;ARGS:text_more"

# [ Asset upload ]
#
# When an uploaded file contains a line that starts with "--", the
# ModSecurity v2 multipart parser can mistake it for a boundary and the
# rule for MULTIPART_UNMATCHED_BOUNDARY in the recommended ModSecurity
# configuration (200004) rejects the upload. This only removes rule 200004,
# and only for multipart uploads to the administration script with the
# login cookie. (Older copies of modsecurity.conf-recommended use the ID
# 200003 for this check; in that case add your own exclusion.)
SecRule TX:movabletype-rule-exclusions-plugin_admin_post "@eq 1" \
    "id:9533120,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'movabletype-rule-exclusions-plugin/0.1.0',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^multipart/form-data" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveById=200004"
